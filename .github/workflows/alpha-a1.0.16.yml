name: Inspect Minecraft Alpha a1.0.16

on:
  push:
    branches: [main]
    paths:
      - "risugami-a1.0.16/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Download and inspect the exact Alpha client
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="$(curl -fsSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json)"
          VERSION_URL="$(printf '%s' "$MANIFEST" | jq -r '.versions[] | select(.id == "a1.0.16") | .url' | head -n 1)"
          test -n "$VERSION_URL"
          VERSION_JSON="$(curl -fsSL "$VERSION_URL")"
          CLIENT_URL="$(printf '%s' "$VERSION_JSON" | jq -r '.downloads.client.url // empty')"
          if [ -z "$CLIENT_URL" ]; then
            echo "The official manifest has no client download entry for a1.0.16."
            exit 1
          fi
          mkdir -p build/alpha build/alpha/source
          curl -fsSL "$CLIENT_URL" -o build/alpha/a1.0.16-client.jar
          printf '%s\n' "Downloaded official Alpha a1.0.16 client" > build/alpha/report.txt
          printf 'Client SHA-1: ' >> build/alpha/report.txt
          sha1sum build/alpha/a1.0.16-client.jar | awk '{print $1}' >> build/alpha/report.txt
          printf '\nClass names related to chat/player/world:\n' >> build/alpha/report.txt
          jar tf build/alpha/a1.0.16-client.jar | grep -Ei 'Minecraft.class|GuiChat.class|EntityPlayer|World.class|GuiIngame.class|ModLoader' >> build/alpha/report.txt || true
          curl -fsSL https://www.benf.org/other/cfr/cfr-0.152.jar -o build/alpha/cfr.jar
          java -jar build/alpha/cfr.jar build/alpha/a1.0.16-client.jar --outputdir build/alpha/source --silent true
          printf '\nRelevant class and method declarations:\n' >> build/alpha/report.txt
          grep -R -n -E '^[[:space:]]*(public|private|protected).*keyTyped|^[[:space:]]*(public|private|protected).*sendChatMessage|^[[:space:]]*(public|private|protected).*addChatMessage|^[[:space:]]*(public|private|protected).*class ' build/alpha/source/ab.java build/alpha/source/net/minecraft/client/Minecraft.java >> build/alpha/report.txt || true
          printf '\nCoordinate-like field declarations in decompiled classes:\n' >> build/alpha/report.txt
          grep -R -n -E '^[[:space:]]*(public|private|protected)?[[:space:]]*(double|float)[[:space:]]+[a-zA-Z_$][a-zA-Z0-9_$]*[[:space:]]*;' build/alpha/source >> build/alpha/report.txt || true
          printf '\nCanvas class signatures (ab):\n' >> build/alpha/report.txt
          javap -classpath build/alpha/a1.0.16-client.jar -private ab >> build/alpha/report.txt 2>&1 || true
          printf '\nCanvas class signatures (ab):\n' >> build/alpha/report.txt
          javap -classpath build/alpha/a1.0.16-client.jar -private ab >> build/alpha/report.txt 2>&1 || true
          printf '\nClasses and declarations using AWT key events:\n' >> build/alpha/report.txt
          grep -R -l 'KeyEvent' build/alpha/source --include='*.java' | while IFS= read -r file; do
            echo "SOURCE=$file" >> build/alpha/report.txt
            grep -n -E '^[[:space:]]*(public|private|protected).*\\(.*KeyEvent|^[[:space:]]*public class |^[[:space:]]*public abstract class ' "$file" >> build/alpha/report.txt || true
          done
          printf '\nClass and method declarations using char/int parameters:\n' >> build/alpha/report.txt
          for file in build/alpha/source/*.java; do
            if grep -q -E '^[[:space:]]*(public|private|protected).*\\([^)]*char[^)]*int|^[[:space:]]*(public|private|protected).*\\([^)]*int[^)]*char' "$file"; then
              echo "SOURCE=$file" >> build/alpha/report.txt
              grep -n -E '^[[:space:]]*(public|private|protected).*\\([^)]*char[^)]*int|^[[:space:]]*(public|private|protected).*\\([^)]*int[^)]*char|^[[:space:]]*public class |^[[:space:]]*public abstract class ' "$file" >> build/alpha/report.txt || true
            fi
          done
          printf '\nCurrent screen class signatures (er):\n' >> build/alpha/report.txt
          javap -classpath build/alpha/a1.0.16-client.jar -private er >> build/alpha/report.txt 2>&1 || true
          printf '\nFont renderer signatures (jt):\n' >> build/alpha/report.txt
          javap -classpath build/alpha/a1.0.16-client.jar -private jt >> build/alpha/report.txt 2>&1 || true
          printf '\nCanvas keyboard dispatch bytecode references:\n' >> build/alpha/report.txt
          javap -classpath build/alpha/a1.0.16-client.jar -private -c ab 2>/dev/null | grep -E 'keyPressed|keyReleased|keyTyped|Method |Field |^[[:space:]]*[0-9]+:' >> build/alpha/report.txt || true
          printf '\nMinecraft field N and likely screen class bb:\n' >> build/alpha/report.txt
          javap -classpath build/alpha/a1.0.16-client.jar -private bb >> build/alpha/report.txt 2>&1 || true
          printf '\nMinecraft keyboard dispatch references:\n' >> build/alpha/report.txt
          javap -classpath build/alpha/a1.0.16-client.jar -private -c net.minecraft.client.Minecraft 2>/dev/null | grep -E 'Field .*bb|Field .*N|KeyEvent|invokevirtual .*\\(CI\\)V|invokevirtual .*\\(Ljava/awt/event/KeyEvent;\\)V' >> build/alpha/report.txt || true
          printf '\nLikely entity classes and inheritance signatures:\n' >> build/alpha/report.txt
          for class in ln jx fv he; do
            echo "CLASS=$class" >> build/alpha/report.txt
            javap -classpath build/alpha/a1.0.16-client.jar -private "$class" >> build/alpha/report.txt 2>&1 || true
          done
          printf '\nMinecraft class declaration:\n' >> build/alpha/report.txt
          javap -classpath build/alpha/a1.0.16-client.jar -private net.minecraft.client.Minecraft >> build/alpha/report.txt 2>&1 || true
      - name: Compile and create the Alpha patch ZIP
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://repo.maven.apache.org/maven2/org/ow2/asm/asm/5.2/asm-5.2.jar -o build/alpha/asm-5.2.jar
          mkdir -p build/alpha/classes
          javac -source 1.7 -target 1.7 -cp build/alpha/asm-5.2.jar -d build/alpha/classes risugami-a1.0.16/src/main/java/TpSetHomeAlpha.java risugami-a1.0.16/src/main/java/PatchAlpha.java
          java -cp build/alpha/classes:build/alpha/asm-5.2.jar PatchAlpha build/alpha/a1.0.16-client.jar build/alpha/classes/TpSetHomeAlpha.class build/alpha/TpSetHome-alpha-a1.0.16.zip
          unzip -l build/alpha/TpSetHome-alpha-a1.0.16.zip
      - name: Upload bytecode inspection report
        uses: actions/upload-artifact@v4
        with:
          name: alpha-a1.0.16-bytecode-report
          path: build/alpha/report.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload TpSetHome Alpha patch
        uses: actions/upload-artifact@v4
        with:
          name: TpSetHome-alpha-a1.0.16-patch
          path: build/alpha/TpSetHome-alpha-a1.0.16.zip
          if-no-files-found: error
          retention-days: 14
