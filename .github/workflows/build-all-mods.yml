name: Build all TpSetHome modules

on:
  workflow_dispatch:
  push:
    paths:
      - 'common/**'
      - 'fabric-*/**'
      - 'forge-*/**'
      - '.github/workflows/build-all-mods.yml'
      - 'settings.gradle'
      - 'build.gradle'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - module: forge-1.2.5
            java: '8'
          - module: forge-1.3.2
            java: '8'
          - module: forge-1.4.7
            java: '8'
          - module: forge-1.5.2
            java: '8'
          - module: forge-1.6.4
            java: '8'
          - module: forge-1.7.10
            java: '8'
          - module: forge-1.8.9
            java: '8'
          - module: forge-1.9.4
            java: '8'
          - module: forge-1.10.2
            java: '8'
          - module: forge-1.11.2
            java: '8'
          - module: forge-1.12.2
            java: '8'
          - module: forge-1.13.2
            java: '8'
          - module: forge-1.14.4
            java: '8'
          - module: forge-1.15.2
            java: '8'
          - module: forge-1.16.5
            java: '8'
          - module: forge-1.18.2
            java: '17'
          - module: forge-1.19.2
            java: '17'
          - module: forge-1.20.1
            java: '17'
          - module: fabric-1.20.1
            java: '17'
          - module: forge-1.21.4
            java: '21'
          - module: forge-1.21.5
            java: '21'
          - module: fabric-1.21.3
            java: '21'
          - module: fabric-1.21.4
            java: '21'
          - module: fabric-1.21.5
            java: '21'
          - module: fabric-1.21.6
            java: '21'
          - module: fabric-1.21.7
            java: '21'
          - module: fabric-1.21.8
            java: '21'
          - module: fabric-1.21.9
            java: '21'
          - module: fabric-1.21.10
            java: '21'
          - module: fabric-1.21.11
            java: '21'
          - module: fabric-26.1
            java: '25'
          - module: fabric-26.2
            java: '25'
          - module: fabric-26.3
            java: '25'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Build module
        run: ./gradlew --no-daemon -PtargetModule=${{ matrix.module }} :${{ matrix.module }}:build

      - name: Upload JARs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tpsethome-${{ matrix.module }}
          path: |
            ${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 30
