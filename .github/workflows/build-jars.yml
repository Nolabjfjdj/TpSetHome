name: Build test JARs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "ci/**"
    paths:
      - "**.gradle"
      - "**.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "common/**"
      - "forge-*/**"
      - "fabric-*/**"
      - ".github/workflows/build-jars.yml"
  pull_request:
    paths:
      - "**.gradle"
      - "**.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "common/**"
      - "forge-*/**"
      - "fabric-*/**"
      - ".github/workflows/build-jars.yml"

permissions:
  contents: read

concurrency:
  group: tpsethome-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - forge-1.21.4
          - forge-1.21.5
          - fabric-1.21.4
          - fabric-1.21.5
          - fabric-1.21.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build mod JAR
        run: gradle --no-daemon :${{ matrix.module }}:build

      - name: Upload JAR for testing
        uses: actions/upload-artifact@v4
        with:
          name: TpSetHome-${{ matrix.module }}
          path: ${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
