name: Build test JARs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**.gradle"
      - "**.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "common/**"
      - "forge-*/**"
      - "fabric-*/**"
      - ".github/workflows/build-jars.yml"
  pull_request:
    paths:
      - "**.gradle"
      - "**.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "common/**"
      - "forge-*/**"
      - "fabric-*/**"
      - ".github/workflows/build-jars.yml"

permissions:
  contents: read

concurrency:
  group: tpsethome-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: forge-1.13.2
            java-version: "8"
            gradle-version: "5.6.4"
          - module: forge-1.14.4
            java-version: "11"
            gradle-version: "5.6.4"
          - module: forge-1.15.2
            java-version: "11"
            gradle-version: "5.6.4"
          - module: forge-1.16.5
            java-version: "17"
            gradle-version: "7.5.1"
          - module: forge-1.18.2
            java-version: "17"
            gradle-version: "7.5.1"
          - module: forge-1.19.2
            java-version: "17"
            gradle-version: "7.5.1"
          - module: forge-1.20.1
            java-version: "17"
            gradle-version: "8.8"
          - module: fabric-1.20.1
            java-version: "17"
            gradle-version: "8.8"
          - module: forge-1.21.4
            java-version: "21"
            gradle-version: "9.3.1"
          - module: forge-1.21.5
            java-version: "21"
            gradle-version: "9.3.1"
          - module: fabric-1.21.4
            java-version: "21"
            gradle-version: "8.14.3"
          - module: fabric-1.21.5
            java-version: "21"
            gradle-version: "8.14.3"
          - module: fabric-1.21.6
            java-version: "21"
            gradle-version: "8.14.3"
          - module: fabric-1.21.8
            java-version: "21"
            gradle-version: "8.14.3"
          - module: fabric-1.21.3
            java-version: "21"
            gradle-version: "8.14.3"
          - module: fabric-1.21.7
            java-version: "21"
            gradle-version: "8.14.3"
          - module: fabric-1.21.9
            java-version: "21"
            gradle-version: "8.14.3"
          - module: fabric-1.21.10
            java-version: "21"
            gradle-version: "8.14.3"
          - module: fabric-26.1
            java-version: "25"
            gradle-version: "9.6.0"
          - module: fabric-26.2
            java-version: "25"
            gradle-version: "9.6.0"
          - module: fabric-26.3
            java-version: "25"
            gradle-version: "9.6.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle-version }}

      - name: Build mod JAR
        run: gradle --no-daemon -PtargetModule=${{ matrix.module }} :${{ matrix.module }}:build

      - name: Upload JAR for testing
        uses: actions/upload-artifact@v4
        with:
          name: TpSetHome-${{ matrix.module }}
          path: ${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
