buildscript {
    repositories {
        mavenCentral()
        maven {
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            url = 'https://jitpack.io/'
        }
    }
    dependencies {
        classpath 'com.github.Chocohead:fabric-loom:9f357ae'
    }
}

apply plugin: 'fabric-loom'
apply plugin: 'java'

version = '1.0.0'
group = 'com.example.sethomemod'

dependencies {
    minecraft 'com.mojang:minecraft:1.2.5'
}

minecraft {
    customManifest = 'https://raw.githubusercontent.com/Nolabjfjdj/TpSetHome/experiment/forge-1.2.5-sin2/experiments/forge-1.2.5-sin2/minecraft-1.2.5.json'
}

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8
