buildscript {
    repositories {
        mavenCentral()
        maven {
            url = 'https://maven.fabricmc.net'
        }
        maven {
            url = 'https://repo.sleeping.town'
        }
    }
    dependencies {
        classpath 'agency.highlysuspect:voldeloom:2.4'
    }
}

apply plugin: 'agency.highlysuspect.voldeloom'
apply plugin: 'java'

version = '1.0.0'
group = 'com.example.sethomemod'
archivesBaseName = 'TpSetHome-forge-1.3.2'

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

String minecraftVersion = '1.3.2'
String forgeVersion = '1.3.2-4.3.5.318'

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    forge "net.minecraftforge:forge:${forgeVersion}:universal@zip"
    mappings "net.minecraftforge:forge:${forgeVersion}:src@zip"
    implementation project(':common')
}

jar {
    from project(':common').sourceSets.main.output
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
