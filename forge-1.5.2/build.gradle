buildscript {
    repositories {
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.1-SNAPSHOT'
    }
}

apply plugin: 'forge'
apply plugin: 'java'

version = '1.0.0'
group = 'com.example.sethomemod'
archivesBaseName = 'TpSetHome-forge-1.5.2'

sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    version = '1.5.2-7.8.1.738'
    runDir = 'run'
    mappings = 'stable_7'
}

repositories {
    mavenCentral()
}

dependencies {
    compile project(':common')
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
