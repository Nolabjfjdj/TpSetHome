buildscript {
    repositories {
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        mavenCentral()
    }
    dependencies {
        classpath 'com.anatawa12.forge:ForgeGradle:1.2-1.1.+'
    }
}

apply plugin: 'forge'
apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'eclipse'

version = '1.0.0'
group = 'com.example.sethomemod'
archivesBaseName = 'TpSetHome-forge-1.6.4'

sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    version = '1.6.4-9.11.1.1345'
    runDir = 'run'
    mappings = 'stable_12'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':common')
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
