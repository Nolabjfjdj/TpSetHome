pluginManagement {
    repositories {
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'TpSetHome'
include 'common'

def allModules = [
    'forge-1.2.5',
    'forge-1.3.2',
    'forge-1.4.7',
    'forge-1.5.2',
    'forge-1.6.4',
    'forge-1.7.10',
    'forge-1.8.9',
    'forge-1.9.4',
    'forge-1.10.2',
    'forge-1.11.2',
    'forge-1.12.2',
    'forge-1.13.2',
    'forge-1.14.4',
    'forge-1.15.2',
    'forge-1.16.5',
    'forge-1.18.2',
    'forge-1.19.2',
    'forge-1.20.1',
    'fabric-1.20.1',
    'forge-1.21.4',
    'neoforge-1.21.4',
    'forge-1.21.5',
    'neoforge-1.21.5',
    'fabric-1.21.3',
    'fabric-1.21.4',
    'fabric-1.21.5',
    'fabric-1.21.6',
    'fabric-1.21.7',
    'fabric-1.21.8',
    'fabric-1.21.9',
    'fabric-1.21.10',
    'fabric-1.21.11',
    'fabric-26.1',
    'fabric-26.2',
    'fabric-26.3'
]

def targetModule = gradle.startParameter.projectProperties.get('targetModule')
if (targetModule != null && !targetModule.trim().isEmpty()) {
    if (!allModules.contains(targetModule)) {
        throw new GradleException("Unknown targetModule: ${targetModule}")
    }
    include targetModule
} else {
    allModules.each { include it }
}
